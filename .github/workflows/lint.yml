name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:
  # For the provenance audit's full sweep; see that job.
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  lisp:
    name: LispBM checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure Python, no dependencies, so this needs nothing built. The render
      # tests are not here: they need the LispBM repl from the vesc_express
      # tree, which is a different repository.
      # Every package that declares pkgLisp, not just the three dash ones. The
      # linter was always capable of it; it had simply never been pointed at
      # the rest, and doing so found two bugs in the linter itself -- a
      # paren-balance check that never stripped comments (so a commented-out
      # fragment with an unclosed paren failed a balanced file) and a crash on
      # a package that uses eeprom-addrs without defining it.
      #
      # --unbound is deliberately not run here, by anything. It reports 183
      # findings on dash_common alone, and the sample is all false: `define`,
      # `fopen` and `load-file` are builtins its list does not know, and it
      # reads font generators that run in the repl rather than on a board.
      # Worth fixing one day; gating on it today would mean a permanently red
      # build, which is the same as no build.
      - name: Lint every lisp package
        run: |
          bad=0
          for desc in */pkgdesc.qml; do
              pkg=${desc%/pkgdesc.qml}
              grep -q 'pkgLisp' "$desc" || continue

              # A QML-only package declares pkgLisp as the empty string, and
              # vesclog does exactly that. It has no sources to lint, which is
              # not a finding.
              if ! find "$pkg" -name '*.lisp' -o -name '*.lbm' | grep -q .; then
                  printf '  --   %s (no lisp sources)\n' "$pkg"
                  continue
              fi

              if out=$(dash_common/test/lint.py "$pkg" 2>&1); then
                  printf '  ok   %s\n' "$pkg"
              else
                  printf '  FAIL %s\n' "$pkg"
                  printf '%s\n' "$out" | sed 's/^/    /'
                  bad=$((bad + 1))
              fi
          done
          printf '\n%d package(s) with findings\n' "$bad"
          [ "$bad" -eq 0 ]


      # Every package's descriptor against what vesc_tool requires of it. Pure
      # Python, so it needs nothing built -- see the script's own header for
      # what it deliberately cannot check.
      - name: Check the package descriptors
        run: tools/check_packages.py

  lua:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A syntax error in a package's script is only found when somebody
      # installs it on a board, because nothing here compiles Lua. luac -p
      # parses without emitting anything, which is the cheapest guard there
      # is. It is not a substitute for running the thing: Garmr's behaviour is
      # tested in the firmware tree, under tests/qemu/test_garmr.
      - name: Install lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Parse every Lua source
        run: |
          bad=0
          while IFS= read -r f; do
              if luac5.4 -p "$f" 2>/tmp/luac.err; then
                  printf '  ok   %s\n' "$f"
              else
                  printf '  FAIL %s\n' "$f"
                  sed 's/^/    /' /tmp/luac.err
                  bad=$((bad + 1))
              fi
          done < <(find . -name '*.lua' -not -path './.git/*' | sort)
          printf '\n%d file(s) failed to parse\n' "$bad"
          [ "$bad" -eq 0 ]

  # Who actually wrote the content of the files this fork adds. Every time
  # something has been lifted out of an upstream file, the new file has been
  # created with this fork's header and only this fork's name -- twenty-four
  # times across four repositories before anyone looked. This is the check
  # that stops that happening to a contribution.
  #
  # On a pull request it audits only the files that PR touches, which takes
  # seconds; the weekly run audits everything.
  provenance:
    name: provenance of added files
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      # blame -C follows lines copied between files, so it needs the history.
      # A shallow clone makes every line look like it originated here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The audit itself lives in the firmware tree, which is the one place it
      # is maintained. Allowed to fail, and the step after reports a skip
      # rather than a pass, because a check that silently did not run is the
      # failure mode this whole exercise was about.
      - name: Check out the audit
        id: tool
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: siigna/bldc
          path: bldc_tool
          sparse-checkout: tests/provenance

      - name: Fetch upstream to compare against
        run: |
          set -e
          url=https://github.com/vedderb/vesc_pkg
          git remote add upstream "$url" 2>/dev/null \
              || git remote set-url upstream "$url"
          git fetch --no-tags --quiet upstream main

      - name: Audit
        run: |
          set -e
          audit=bldc_tool/tests/provenance/audit.py

          if [ ! -f "$audit" ]; then
              echo "  skipped: could not check out the audit from siigna/bldc"
              exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch --no-tags --quiet origin "$GITHUB_BASE_REF"
              mapfile -t files < <(git diff --name-only \
                  "origin/$GITHUB_BASE_REF...HEAD")
              printf '%s file(s) changed by this pull request\n' "${#files[@]}"
              python3 "$audit" . upstream/main "${files[@]}"
          else
              python3 "$audit" . upstream/main
          fi
